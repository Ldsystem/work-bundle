id: default-work-bundle-tree
status: current
roots:
  - roles
  - rules
  - .work-bundle/git
  - .work-bundle/knowledge/notes
  - .work-bundle/knowledge/open-questions
  - .work-bundle/knowledge/context-packs
  - .work-bundle/knowledge/indexes
  - .work-bundle/orchestration/spec/active
  - .work-bundle/orchestration/spec/archived
  - .work-bundle/orchestration/plan/active
  - .work-bundle/orchestration/plan/archived
  - .work-bundle/orchestration/result/executor/active
  - .work-bundle/orchestration/result/executor/reviewed
  - .work-bundle/orchestration/result/executor/superseded
  - .work-bundle/orchestration/result/executor/archived
  - .work-bundle/orchestration/result/accepted/active
  - .work-bundle/orchestration/result/accepted/superseded
  - .work-bundle/orchestration/result/accepted/archived
  - .work-bundle/orchestration/review/implementation/active
  - .work-bundle/orchestration/review/implementation/superseded
  - .work-bundle/orchestration/review/implementation/archived
  - .work-bundle/orchestration/review/final/active
  - .work-bundle/orchestration/review/final/archived
  - .work-bundle/orchestration/docs
  - .work-bundle/orchestration/principles
  - .work-bundle/orchestration/templates
  - .work-bundle/orchestration/execution-state
multi_repository_workspace_resources:
  - path: script/index.yaml
    template: references/assets/template/script-index.yaml
    preserve_non_empty: true
  - path: credentials/credentials.yaml
    template: references/assets/template/credentials.yaml
    preserve_non_empty: true
    directory_mode: "0700"
    file_mode: "0600"
    git_ignored: true
