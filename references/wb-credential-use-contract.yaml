id: credential-use-contract
status: current
store:
  version: 1
  path: credentials/credentials.yaml
  only_permitted_entry_in_directory: credentials.yaml
  directory_mode: "0700"
  file_mode: "0600"
  symlink: forbidden
  git_ignored: required
entry_schema:
  closed: true
  required: [id, description, severity, operation, credential]
  optional: [targets, scopes]
  ids_unique: true
  mapping_entries_only: true
  severity:
    allowed: [low, medium, high, critical]
  operation:
    allowed: [read-only, read-write]
    meaning: maximum-permitted-use
  credential:
    discriminator: kind
    exactly_one_form: true
    closed_forms: true
    forms:
      password_file:
        required: [path]
      username_password:
        required: [username, password]
        inline_secret_fields: [username, password]
      ssh_private_key:
        required: [private_key_path]
        optional: [passphrase]
        inline_secret_fields: [passphrase]
      passphrase:
        required: [passphrase]
        inline_secret_fields: [passphrase]
      environment_reference:
        required: [variable]
      external_secret_reference:
        required: [provider, reference]
workflow:
  gates:
    - resolve-workspace-without-secret-read
    - select-by-non-secret-metadata
    - authorize-task-target-and-operation
    - validate-store-protection-and-schema
    - select-least-exposure-injection
    - execute-bounded-consumer
    - redact-visible-output
    - write-redacted-audit-evidence
  fail_closed: true
  high_requires_exact_target_and_purpose: true
  critical_or_read_write_requires_explicit_current_task_authority: true
injection:
  adapter_by_form:
    password_file: {mechanism: path-reference, secret_value_read_by_helper: false}
    username_password: {mechanism: protected-fd, secret_value_read_by_helper: true}
    ssh_private_key: {mechanism: path-reference, passphrase_supported: false}
    passphrase: {mechanism: stdin, secret_value_read_by_helper: true}
    environment_reference: {mechanism: child-environment, parent_environment_mutation: forbidden}
    external_secret_reference: {mechanisms: [keychain, ssh-agent], supported_providers: [keychain, ssh-agent]}
  allowed:
    - ssh-agent
    - keychain
    - path-reference
    - protected-file-descriptor
    - stdin
    - child-process-scoped-environment
  forbidden:
    - command-line-secret-argument
    - shell-tracing
    - command-text-interpolation
    - clipboard
    - persistent-environment-export
    - generic-one-value-environment-for-multipart-credential
    - raw-child-output
  consumer_contract:
    shell: forbidden
    output: suppressed
    requested_adapter_must_match_form: true
    unsupported_adapter_blocks_before_value_access: true
adapter_result:
  required: [credential_id, target, requested_operation, effective_operation, injection_mechanism, result, redacted_failure_code]
  injection_mechanism: [ssh-agent, keychain, path-reference, protected-fd, stdin, child-environment]
  result: [passed, failed, blocked]
  forbidden: [credential_value, sensitive_path, environment_content, raw_child_output, key_fingerprint]
visible_output:
  allowed_metadata: [id, description, severity, operation, credential_kind, redacted_targets]
  secret_values: forbidden
  credential_file_content: forbidden
  public_value_bearing_fields: forbidden
audit:
  path_scope: .work-bundle/orchestration/execution-state
  required:
    - timestamp
    - credential_id
    - target
    - requested_operation
    - effective_operation
    - invoking_skill_or_script_id
    - authorization_source
    - result
    - redacted_failure_code
  forbidden: [credential_value, credential_file_content]
validation:
  synthetic_canary_only: true
  zero_visible_occurrences_required: true
  visible_surfaces: [command-arguments, parent-environment, stdout, stderr, exceptions, logs, handoffs, indexes, git-diff]
