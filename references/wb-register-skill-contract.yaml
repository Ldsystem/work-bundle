id: skill-registry-entry-contract
status: current
required:
  - type
  - source
  - mode
  - priority
  - used_by
  - stages
  - allowed_outputs
  - validation
  - fallback
stable_roles:
  - project-manager
  - solution-architect
  - domain-analyst
  - ui-designer
  - frontend-developer
  - backend-developer
  - database-engineer
  - qa-reviewer
  - devops-engineer
registration_authority:
  scope: external-skills-only
  built_in_work_bundle_skills: toolkit-owned-not-registered
  registry_path_source: bootstrap.skill_registry
  proposal_must_be_redacted: true
  explicit_confirmation_required_for_merge: true
  unconfirmed_proposals_must_not_mutate_registry: true
  non_external_entries_must_be_rejected: true
