metadata_version: 4
authority_split:
  portable: .work-bundle/project.yaml
  device_local: bootstrap.project_registry#device_bindings
  registry_resolution: $work_bundle_config_root/bootstrap.yaml -> project_registry
  v3_compatibility:
    project_metadata_local_state: explicit-read-or-migration-only
workspace:
  required: [id, slug, mode]
  id:
    stable_across_devices: true
  mode:
    allowed: [single-repository, multi-repository, composite]
source_repositories:
  durable_identity: [id, remote.canonical]
  workspace_binding:
    single_repository:
      type: root
    multi_repository:
      type: member
      name: required
    composite:
      root:
        type: root
        count: 1
      member:
        type: member
        name: required
        name_unique: true
        path: one-segment-under-workspace-root
        path_unique: true
        checkout_kind: nested-member
        replay_requires:
          member_checkout: matching-remote-and-branch
          device_binding: exact-path-nested-member
          root_exclude: member-pattern-present
    remote_only: absent
  local_binding_fields_forbidden: [project_root, observed_head, observation_time, git_control_root]
add_workspace_member:
  preflight:
    root_origin: corroborate-against-portable-canonical
    root_branch: corroborate-against-portable-default-branch
  proposal:
    validate_request_values: true
    validate_rendered_target_metadata: true
migration:
  explicit: true
  dry_run_proposal: true
  exact_proposal_id_apply: true
  remote_identity_required_for_git: true
  single_repository:
    source_checkout: workspace_root
    control_plane_checkout: workspace_root/.work-bundle
    source_excludes: [.work-bundle/]
    tracked_agents_preserved: true
    container_conversion_required: false
attachment:
  sequence: [clone-control-plane, validate-portable-metadata, resolve-root-binding, materialize-source-in-place, validate, publish-local-binding]
  failed_root_materialization: rollback-source-git-and-created-source-paths
  failed_member_materialization:
    rollback: current-attach-owned-member-paths-only
    preserve: [pre-existing-checkouts, user-supplied-checkouts, control-plane]
    binding_publication: forbidden-on-failure
control_plane:
  sync_policy: manual
  automatic_push_pull: false
orchestration_control:
  optional_for_legacy_workspaces: true
  schema_version: 1
  post_execution_review_round_limit: 5
  rejected_execution_policy: review_revision_limit
  portable_state:
    post_execution_review_flows: stable_flow_projection
    blockers: active_evidence_references
    closed_flows: administrative_outcomes
    implementation_exemptions: exact_flow_and_blocker_only
  admission:
    operation_classes: [ordinary_new, reconciliation, round_completion, read_only, blocker_recording, knowledge_return, finalization]
    mutation_failure_mode: fail_closed
    blocker_evidence: workspace_relative_existing_regular_file
    refusal_guidance: [metadata_path, blocker_id, specification, orch-bounded-closure]
  exception_restoration:
    backup: exact_bytes_and_sha256
    merge_preserves: [newer_fields, unrelated_blockers, closed_flows, corrected_round_policy]
    removes: named_flow_and_blocker_exception_only
security:
  portable_forbidden: [credentials, git, runtime, orchestration/execution-state, machine_bindings]
