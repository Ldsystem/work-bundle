id: rule-orch-artifact-role-separation
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [spec, plan, task, handoff, or review is created]
severity: must
rule: orch-artifact-role-separation applies to directive-scoped migrated skills.
required_behavior: [keep specifications, plans, tasks, handoffs, and reviews in distinct roles]
prohibited_behavior: [duplicate full specs inside plans or turn tasks into mini-specs]
validation: [required fields exist, generated skills cite applicable rule]
source_authority: [orchestrator SKILL boundaries]
deprecated_sources: []
