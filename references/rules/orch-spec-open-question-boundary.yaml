id: rule-orch-spec-open-question-boundary
status: current
scope: work-bundle
applies_to: {paths: [.work-bundle/orchestration/spec/**, skills/orch-create-specification/SKILL.md, references/orch-directives/create-specification.md], skills: [orch-create-specification], artifacts: [specification]}
enable_when: [specification is created or repaired from knowledge or source artifacts]
severity: must
rule: specifications may expose uncertainty but must not convert unresolved uncertainty into requirements.
required_behavior: [inspect relevant knowledge notes and open questions through the approved gateway, include Open Questions table when relevant uncertainty exists, classify each question blocking yes or no, state none when no relevant uncertainty exists]
prohibited_behavior: [treat draft or proposed notes as current authority, bury blocking uncertainty in assumptions, omit relevant open questions]
validation: [spec includes Open Questions section, each uncertainty has ID source scope blocking classification and required resolution]
source_authority: [/Users/shenglong/Documents/Repository/Designs/keep-summarizing/cursor_knowledge_orchestrator_files/docs/v4.1-/restriction-on-openquestions.md]
deprecated_sources: []
