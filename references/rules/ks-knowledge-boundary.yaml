id: rule-ks-knowledge-boundary
status: current
scope: work-bundle
applies_to: {paths: [skills/ks-*/SKILL.md, references/ks-*], skills: [ks-*], artifacts: []}
enable_when: [knowledge access or write is requested]
severity: must
rule: ks-knowledge-boundary applies to directive-scoped migrated skills.
required_behavior: [treat .work-bundle/knowledge as durable source of truth]
prohibited_behavior: [write orchestration artifacts as knowledge]
validation: [required fields exist, generated skills cite applicable rule]
source_authority: [ks SKILL and workflow]
deprecated_sources: []
