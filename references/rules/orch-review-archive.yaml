id: rule-orch-review-archive
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [review-plan succeeds or fails]
severity: must
rule: orch-review-archive applies to directive-scoped migrated skills.
required_behavior: [archive on success or create repair specification on failure]
prohibited_behavior: [archive during execute-plan or ignore failed validation]
validation: [required fields exist, generated skills cite applicable rule]
source_authority: [orchestrator review rule]
deprecated_sources: []
