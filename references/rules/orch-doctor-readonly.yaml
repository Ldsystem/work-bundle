id: rule-orch-doctor-readonly
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [doctor directive runs]
severity: must
rule: orch-doctor-readonly applies to directive-scoped migrated skills.
required_behavior: [run diagnostics read-only and report repair actions]
