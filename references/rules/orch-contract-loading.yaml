id: rule-orch-contract-loading
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [artifact is created or validated]
severity: must
rule: orch-contract-loading applies to directive-scoped migrated skills.
required_behavior: [load only required directive contract and template references]
prohibited_behavior: [inline unrelated long contracts or examples]
validation: [required fields exist, generated skills cite applicable rule]
source_authority: [orchestrator load policy]
deprecated_sources: []
