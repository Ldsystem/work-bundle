metadata_version: 4
authority: canonical
workspace:
  id: <stable-workspace-id>
  slug: <workspace-slug>
  mode: <single-repository|multi-repository|composite>
  industry: <industry-or-domain>

metadata_compatibility:
  readable_versions: [2, 3, 4]
  migration_requires_explicit_apply: true
  preserves_unknown_fields: true

# Workspace-owned resources for both single- and multi-repository modes.
workspace_resources:
  script_index:
    path: script/index.yaml
    status: current
  credential_store:
    path: credentials/credentials.yaml
    status: protected

execution_workspace_profiles:
  default:
    hydrate:
      - path: .codegraph
        strategy: regenerate
      - path: .env.local
        strategy: credential-inject
      - path: config/local.yaml
        strategy: copy
        sensitivity: non-secret
    setup:
      - pnpm install --frozen-lockfile
    baseline:
      - pnpm test

agents_sync:
  managed_section: work-bundle-rule
  template_path: references/assets/template/AGENTS.md
  template_checksum_sha256: ""
  last_synced_at: ""
  status: never-synced

language:
  - <runtime-or-framework>

operation_policy:
  project_files:
    allow: [read, create, update]
    forbid: [delete_unknown_files, overwrite_non_empty_without_force]
  git:
    allow_operations: [status, diff, log, branch --show-current, rev-parse HEAD]
    permissive_operations: [stage, commit, pull]
    forbid_operations: [reset --hard, clean -fd, push --force]

source_repository_roles:
  project_metadata: "Portable authority: stable repository ID, canonical remote, default branch, and workspace binding."
  device_binding: "Device-local authority: checkout path, observed branch/HEAD, Git control root, lifecycle observation, and CodeGraph state."

source_repositories:
  - id: <stable-repository-id>
    role: source
    remote:
      canonical: <canonical-repository-remote>
      aliases: []
    default_branch: <required-working-branch>
    workspace_binding:
      type: <root|member>
      name: <required-for-member>
      path: <one-segment-member-path-when-applicable>
    materialization:
      required: true
    operation_policy: inherit

control_plane:
  schema_version: 1
  repository:
    remote: <canonical-control-plane-remote-or-empty>
  sync_policy:
    mode: manual

# Optional for legacy workspaces. The controller owns round history under
# .work-bundle/runtime/orchestration-control/ and projects only stable state here.
orchestration_control:
  schema_version: 1
  post_execution_review_round_limit: 5
  post_execution_review_flows: []
  blockers: []
  closed_flows: []
  implementation_exemptions: []

prefer_subagent: false

migration:
  authority_owner: /wb-initialize-project
  compatibility_window: metadata-v2-v3-readable-until-explicit-v4-apply
  doctor_flow: "Use /wb-initialize-project doctor for deterministic portable metadata and device-binding repair."
  migrate_flow: "Inspect or dry-run metadata v2/v3, then use an exact proposal ID with explicit --apply for v4 conversion."
