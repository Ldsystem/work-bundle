metadata_version: 4
authority: canonical
workspace:
  id: <stable-workspace-id>
  slug: <workspace-slug>
  mode: <single-repository|multi-repository|composite>
control_plane:
  schema_version: 1
  repository:
    remote: <control-plane-remote-or-empty>
  sync_policy:
    mode: manual
source_repositories:
  - id: <stable-repository-id>
    role: source
    remote:
      canonical: <canonical-repository-remote>
      aliases: []
    default_branch: <default-branch>
    workspace_binding:
      type: <root|member>
      name: <workspace-relative-member-name-or-empty>
    materialization:
      required: true
    operation_policy: inherit
