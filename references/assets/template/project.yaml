metadata_version: 3
authority: workspace-working-state
workspace_root: <absolute-path-to-workspace-root>
workspace_mode: <single-repository|multi-repository>
project_root: <absolute-path-to-project-root>
industry: <industry-or-domain>
prefer_subagent: false

metadata_compatibility:
  readable_versions: [2, 3]
  migration_requires_explicit_apply: true
  preserves_unknown_fields: true

workspace_resources:
  script_index:
    path: script/index.yaml
    status: current
  credential_store:
    path: credentials/credentials.yaml
    status: protected

execution_workspace_profiles:
  default:
    hydrate:
      - path: .codegraph
        strategy: regenerate
      - path: .env.local
        strategy: credential-inject
      - path: config/local.yaml
        strategy: copy
        sensitivity: non-secret
    setup:
      - pnpm install --frozen-lockfile
    baseline:
      - pnpm test

agents_sync:
  managed_section: work-bundle-rule
  template_path: references/assets/template/AGENTS.md
  template_checksum_sha256: ""
  last_synced_at: ""
  status: never-synced

language:
  - <runtime-or-framework>

operation_policy:
  project_files:
    allow: [read, create, update]
    forbid: [delete_unknown_files, overwrite_non_empty_without_force]
  git:
    allow_operations: [status, diff, log, branch --show-current, rev-parse HEAD]
    permissive_operations: [stage, commit, pull]
    forbid_operations: [reset --hard, clean -fd, push --force]

source_repository_roles:
  registry: "Locator only: workspace slug/root and stable repository origin identity and locators."
  project_metadata: "Working-state authority: member path, branch/HEAD observation, lifecycle transaction, operation policy, and CodeGraph state."

source_repositories:
  - id: <stable-repository-id>
    project_root: <absolute-path-to-source-repository>
    origin_id: <stable-repository-id>
    checkout_kind: single-repository
    git_control_root: <absolute-path-to-source-repository>/.git
    git_control_scope: project
    worktree_name: <stable-repository-id>
    git_repository: true
    expected_branch: <required-working-branch>
    base_ref: HEAD
    observed_head: <git-head-commit-or-empty-for-non-git>
    observation_time: <rfc3339-observation-time>
    baseline_status: current
    lifecycle_status: active
    operation_policy: inherit
    codegraph:
      supported: false
      index_present: false
      root: <absolute-path-to-source-repository>
      status: not-indexed
      synced_commit_id: ""
      last_synced_at: ""
      reason: no-index

lifecycle_transaction:
  state: published
  registry_status: published
  metadata_status: published

migration:
  authority_owner: /wb-initialize-project
  compatibility_window: metadata-v2-readable-until-explicit-v3-apply
  doctor_flow: "Use /wb-initialize-project doctor for deterministic file-only repair."
  migrate_flow: "Inspect or dry-run metadata v2, then use explicit --apply for v3 conversion."
