id: rule-orch-knowledge-gateway
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [orchestration needs durable knowledge]
severity: must
rule: orchestration knowledge retrieval uses the ks-what-is-helpful gateway for full candidate discovery followed by narrow authority classification.
required_behavior: [retrieve through ks-what-is-helpful before using knowledge context, discover relevant candidates across allowed lifecycle partitions before lifecycle and status authority classification, use only authority results to shape requirements tasks decisions or review conclusions, keep gateway output to the smallest useful classified result set]
prohibited_behavior: [browse .work-bundle/knowledge directly as shortcut, prefilter discovery to authority lifecycle stages, let non-authority results directly shape downstream work, retrieve durable knowledge during execute-plan]
validation: [gateway preserves full discovery and narrow authority, direct orchestration knowledge browsing remains prohibited, execute-plan remains no-retrieval, generated skills cite applicable rule]
source_authority: [orchestrator SKILL knowledge gateway]
deprecated_sources: []
