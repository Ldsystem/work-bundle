id: rule-orch-plan-open-question-gate
status: current
scope: work-bundle
applies_to: {paths: [.work-bundle/orchestration/plan/**, skills/orch-create-implementation-plan/SKILL.md, references/directives/orchestration/create-implementation-plan.md], skills: [orch-create-implementation-plan], artifacts: [implementation-plan, phase, task]}
enable_when: [implementation plan is created from a specification]
severity: must
rule: implementation planning must not start from a specification with unresolved open questions.
required_behavior: [inspect the source specification Open Questions section first, refuse planning when unresolved questions remain, require explicit user resolution and revised specification before planning]
prohibited_behavior: [infer answers silently, choose an unresolved alternative, downgrade blocking questions to continue, create partial plans for unresolved scope]
validation: [plan creation either cites no unresolved questions or returns the required refusal table]
source_authority: [/Users/shenglong/Documents/Repository/Designs/keep-summarizing/cursor_knowledge_orchestrator_files/docs/v4.1-/restriction-on-openquestions.md]
deprecated_sources: []
