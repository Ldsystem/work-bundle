id: rule-integrity-check-loading-boundary
status: current
scope: work-bundle
applies_to:
  paths:
    - references/bootstrap/agent-bootstrap.md
    - references/bootstrap/repository-binding.md
    - rules/*.yaml
  skills:
    - wb-integrity-check
  artifacts:
    - integrity-report
enable_when:
  - integrity-check evaluates startup and compression boundaries
severity: must
required_behavior:
  - detect and report eager loading that violates startup-minimal context rules
  - verify loading boundaries for agent-bootstrap, project-domain-profile, repository-binding, and roadmap files
  - classify loading issues with explicit risk level and concrete remediation action
prohibited_behavior:
  - forcing startup to load full roadmap, full repository-binding, full project-domain-profile, all notes, all rules, or all skill references
validation:
  - report includes compression/loading section and startup-loading matrix
  - findings include runtime_loading_risk and recommended_action fields
source_authority:
  - rules/integrity-check/index.yaml
