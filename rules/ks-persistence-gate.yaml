id: rule-ks-persistence-gate
status: current
scope: work-bundle
applies_to: {paths: [skills/ks-*/SKILL.md, references/ks-*], skills: [ks-*], artifacts: []}
enable_when: [knowledge write may occur]
severity: must
rule: ks-persistence-gate applies to directive-scoped migrated skills.
required_behavior: [resolve project, directive, perspective, status, source, evidence, and allowed path before writing]
prohibited_behavior: [guess missing project, lifecycle, status, or target path]
validation: [required fields exist, generated skills cite applicable rule]
source_authority: [ks SKILL and workflow]
deprecated_sources: []
