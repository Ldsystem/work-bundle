rules:
  - id: agent-codegraph-first
    path: agent-codegraph-first.md
    applies_when:
      - the targeted repository root contains `.codegraph/`
      - task affects source-code files in that targeted repository that CodeGraph indexes with meaningful symbol or relation extraction
      - task requires source-code browsing, inspection, review, planning, repair, refactor, migration, or editing
      - task requires locating symbols, files, call chains, dependencies, module boundaries, implementation paths, or impact radius
      - task is not limited to Markdown rules, skills, references, templates, documentation, or WorkBundle knowledge-only edits
    enforcement: must
    load: conditional
    requires: []
  - id: ks-context-pack-policy
    path: keep-summarizing/ks-context-pack-policy.md
    applies_when:
      - context packs are requested
      - context-pack maintenance or migration is performed
    enforcement: must
    load: conditional
    requires: []
  - id: ks-git-authority
    path: keep-summarizing/ks-git-authority.md
    applies_when:
      - git operation is requested inside the selected durable knowledge repo
      - keep-summarizing git authority is evaluated for a migration or maintenance task
    enforcement: must
    load: conditional
    requires: []
  - id: ks-index-maintenance
    path: keep-summarizing/ks-index-maintenance.md
    applies_when:
      - durable notes accepted context packs or open questions change
      - completion follows a note or open-question write
    enforcement: must
    load: conditional
    requires: []
  - id: ks-knowledge-boundary
    path: keep-summarizing/ks-knowledge-boundary.md
    applies_when:
      - knowledge access or write is requested
    enforcement: must
    load: conditional
    requires: []
  - id: ks-note-state-authority
    path: keep-summarizing/ks-note-state-authority.md
    applies_when:
      - knowledge note state affects retrieval or persistence authority
    enforcement: must
    load: conditional
    requires: []
  - id: ks-off-switches
    path: keep-summarizing/ks-off-switches.md
    applies_when:
      - user disables persistence or asks draft only
    enforcement: must
    load: conditional
    requires: []
  - id: ks-open-question-policy
    path: keep-summarizing/ks-open-question-policy.md
    applies_when:
      - future work or unresolved question is handled
      - open-question persistence is proposed or requested
    enforcement: must
    load: conditional
    requires: []
  - id: ks-persistence-gate
    path: keep-summarizing/ks-persistence-gate.md
    applies_when:
      - knowledge write may occur
    enforcement: must
    load: conditional
    requires: []
  - id: ks-perspective-routing
    path: keep-summarizing/ks-perspective-routing.md
    applies_when:
      - note path or perspective is selected
    enforcement: must
    load: conditional
    requires: []
  - id: ks-sensitivity-filter
    path: keep-summarizing/ks-sensitivity-filter.md
    applies_when:
      - source content is inspected or written
    enforcement: must
    load: conditional
    requires: []
  - id: ks-structural-value
    path: keep-summarizing/ks-structural-value.md
    applies_when:
      - candidate durable point is evaluated
    enforcement: must
    load: conditional
    requires: []
  - id: orch-artifact-authoring
    path: orchestration/orch-artifact-authoring.md
    applies_when:
      - an orchestration artifact is created or validated
      - a specification, plan, phase, task, handoff, or orchestration document is authored or repaired
    enforcement: must
    load: conditional
    requires: []
  - id: orch-handoff-required
    path: orchestration/orch-handoff-required.md
    applies_when:
      - a task, phase, or plan execution completes or is blocked
      - an executor-result or orchestration handoff is created after orchestration or execution work
    enforcement: must
    load: conditional
    requires: []
  - id: orch-knowledge-gateway
    path: orchestration/orch-knowledge-gateway.md
    applies_when:
      - create-specification needs durable project knowledge before drafting
      - create-implementation-plan needs durable project knowledge or spec repair context
      - create-document needs durable project knowledge before drafting
      - create-handoff needs durable project knowledge for an orchestration handoff outside execution completion
      - review-plan needs durable project knowledge for validation-backed review
    enforcement: must
    load: conditional
    requires: []
  - id: orch-open-questions
    path: orchestration/orch-open-questions.md
    applies_when:
      - a specification is created or repaired
      - an implementation plan is created from a specification
    enforcement: must
    load: conditional
    requires: []
  - id: orch-orchestration-boundary
    path: orchestration/orch-orchestration-boundary.md
    applies_when:
      - any orchestration artifact is created, updated, validated, or reviewed
      - an orch-* skill writes or validates content under .work-bundle/orchestration/
    enforcement: must
    load: conditional
    requires: []
  - id: orch-review-completion
    path: orchestration/orch-review-completion.md
    applies_when:
      - review-plan runs after implementation
      - orchestration completion may create or change durable implementation knowledge during specification authoring, planning, or review
    enforcement: must
    load: conditional
    requires: []
  - id: rule-integrity-check-agent-authority
    path: integrity-check/rule-integrity-check-agent-authority.md
    applies_when:
      - wb-integrity-check runs
    enforcement: must
    load: conditional
    requires: []
  - id: rule-integrity-check-loading-boundary
    path: integrity-check/rule-integrity-check-loading-boundary.md
    applies_when:
      - integrity-check evaluates startup and compression boundaries
    enforcement: must
    load: conditional
    requires: []
  - id: rule-integrity-check-report-lifecycle
    path: integrity-check/rule-integrity-check-report-lifecycle.md
    applies_when:
      - integrity report is created or updated
    enforcement: must
    load: conditional
    requires: []
  - id: rule-integrity-check-scope
    path: integrity-check/rule-integrity-check-scope.md
    applies_when:
      - wb-integrity-check runs
    enforcement: must
    load: conditional
    requires: []
  - id: rule-integrity-check-script-boundary
    path: integrity-check/rule-integrity-check-script-boundary.md
    applies_when:
      - integrity-check helper CLI commands run
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-lifecycle-authority
    path: lifecycle-authority.md
    applies_when:
      - v4 work-bundle operation requires lifecycle-authority
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-repository-boundary
    path: repository-boundary.md
    applies_when:
      - v4 work-bundle operation requires repository-boundary
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-role-context
    path: role-context.md
    applies_when:
      - v4 work-bundle operation requires role-context
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-runtime-artifact-format
    path: runtime-artifact-format.md
    applies_when:
      - v4 work-bundle operation requires runtime-artifact-format
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-security-exclusion
    path: security-exclusion.md
    applies_when:
      - v4 work-bundle operation requires security-exclusion
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-skill-registry
    path: skill-registry.md
    applies_when:
      - v4 work-bundle operation requires skill-registry
    enforcement: must
    load: conditional
    requires: []
  - id: wb-create-rule
    path: work-bundle/wb-create-rule.md
    applies_when:
      - user requests creation, update, migration, or validation of work-bundle runtime rules
      - agent creates or edits Markdown rule files under rules/
      - agent registers or syncs rules in rules/index.yaml
      - agent creates, validates, registers, or syncs toolkit, global user, or project rule-store scopes
    enforcement: must
    load: conditional
    requires: []
  - id: wb-project-registry
    path: work-bundle/wb-project-registry.md
    applies_when:
      - task.registers_project
      - task.creates_workspace_slug
      - task.resolves_project_location
      - task.resolves_knowledge_base_location
    enforcement: must
    load: conditional
    requires: []
  - id: wb-project-context-preflight
    path: work-bundle/wb-project-context-preflight.md
    applies_when:
      - orchestration workflow resolves project metadata before specification evidence, implementation planning, execution, review, or project scope updates
      - repository preflight evaluates source repositories from `.work-bundle/project.yaml`
      - agent checks branch baseline, commit baseline, registry locator, or CodeGraph support for a source repository
    enforcement: must
    load: conditional
    requires: []
  - id: wb-script-instruction
    path: work-bundle/wb-script-instruction.md
    applies_when:
      - user requests creation of a new work-bundle script
      - user requests update of scripts under scripts/
      - agent maintains script dispatchers, doctors, or project initialization scripts
    enforcement: must
    load: conditional
    requires: []
  - id: wb-skill-registry
    path: work-bundle/wb-skill-registry.md
    applies_when:
      - task.registers_skill
      - task.resolves_available_skills
      - task.resolves_role_skills
      - task.resolves_stage_skills
    enforcement: must
    load: conditional
    requires: []
  - id: wb-violation-evaluation
    path: work-bundle/wb-violation-evaluation.md
    applies_when:
      - a conflict, violation, error, failed validation, contradictory workflow behavior, user interruption, or user correction occurs during WorkBundle-guided work
      - visible task evidence suggests a WorkBundle skill, rule, script, specification, plan, handoff, workflow contract, or toolkit execution surface may have caused or contributed to the problem
      - an agent must decide whether an observed problem is work-bundle-scoped, project-scoped, mixed, or undetermined before creating violation evidence or reporting a blocker
    enforcement: must
    load: conditional
    requires: []
  - id: wb-violation-evidence
    path: work-bundle/wb-violation-evidence.md
    applies_when:
      - wb-violation-evaluation classifies an observed conflict, violation, error, failed validation, contradictory workflow behavior, user interruption, or user correction as work-bundle-scoped or mixed
      - visible first-observed evidence must be stored after evaluation identifies a WorkBundle skill, rule, script, workflow, orchestration contract, handoff contract, or toolkit execution surface deviation
    enforcement: must
    load: always
    requires:
      - wb-violation-evaluation
