rules:
  - id: agent-codegraph-first
    path: agent-codegraph-first.md
    applies_when:
      - the targeted repository root contains `.codegraph/`
      - task affects source-code files in that targeted repository that CodeGraph indexes with meaningful symbol or relation extraction
      - task requires source-code browsing, inspection, review, planning, repair, refactor, migration, or editing
      - task requires locating symbols, files, call chains, dependencies, module boundaries, implementation paths, or impact radius
      - task is not limited to Markdown rules, skills, references, templates, documentation, or WorkBundle knowledge-only edits
    enforcement: must
    load: conditional
    requires: []
  - id: ks-context-pack-policy
    path: keep-summarizing/ks-context-pack-policy.md
    applies_when:
      - context packs are requested
      - context-pack maintenance or migration is performed
    enforcement: must
    load: conditional
    requires: []
  - id: ks-git-authority
    path: keep-summarizing/ks-git-authority.md
    applies_when:
      - git operation is requested inside the selected durable knowledge repo
      - keep-summarizing git authority is evaluated for a migration or maintenance task
    enforcement: must
    load: conditional
    requires: []
  - id: ks-index-maintenance
    path: keep-summarizing/ks-index-maintenance.md
    applies_when:
      - managed durable notes, accepted context packs, or open questions change
      - completion follows a canonical note or open-question mutation
      - a user requests regeneration of stale, missing, or deleted derived knowledge indexes
    enforcement: must
    load: conditional
    requires: []
  - id: ks-knowledge-boundary
    path: keep-summarizing/ks-knowledge-boundary.md
    applies_when:
      - managed durable project knowledge is retrieved, persisted, or selected for migration or read-only intake
    enforcement: must
    load: conditional
    requires: []
  - id: ks-note-state-authority
    path: keep-summarizing/ks-note-state-authority.md
    applies_when:
      - an agent retrieves or persists a knowledge note whose lifecycle state controls its authority
    enforcement: must
    load: conditional
    requires: []
  - id: ks-off-switches
    path: keep-summarizing/ks-off-switches.md
    applies_when:
      - user disables persistence or asks draft only
    enforcement: must
    load: conditional
    requires: []
  - id: ks-open-question-policy
    path: keep-summarizing/ks-open-question-policy.md
    applies_when:
      - a managed future-work watchpoint is proposed for tracking or persisted with explicit user intent
      - an accepted project open question is retrieved, reported, or resolved as watch context
    enforcement: must
    load: conditional
    requires: []
  - id: ks-persistence-gate
    path: keep-summarizing/ks-persistence-gate.md
    applies_when:
      - an agent prepares a durable knowledge note, context pack, or open-question write
    enforcement: must
    load: conditional
    requires: []
  - id: ks-perspective-routing
    path: keep-summarizing/ks-perspective-routing.md
    applies_when:
      - a durable knowledge note or accepted open question needs canonical path, leaf perspective, or ownership selection
    enforcement: must
    load: conditional
    requires: []
  - id: ks-sensitivity-filter
    path: keep-summarizing/ks-sensitivity-filter.md
    applies_when:
      - source content is inspected for or written to durable knowledge
    enforcement: must
    load: conditional
    requires: []
  - id: ks-structural-value
    path: keep-summarizing/ks-structural-value.md
    applies_when:
      - candidate durable point is evaluated
    enforcement: must
    load: conditional
    requires: []
  - id: orch-artifact-authoring
    path: orchestration/orch-artifact-authoring.md
    applies_when:
      - an orchestration artifact is created or validated
      - a specification, plan, phase, task, executor result, implementation review, accepted task result, final workflow review, or orchestration document is authored or repaired
    enforcement: must
    load: conditional
    requires: []
  - id: orch-bounded-closure
    path: orchestration/orch-bounded-closure.md
    applies_when:
      - ordinary orchestration artifact mutation, dispatch, or reconciliation evaluates current workspace admission and blocker authority
      - orchestration admission evaluates an active workspace blocker or exact scoped implementation exemption
    enforcement: must
    load: conditional
    requires: []
  - id: orch-handoff-required
    path: orchestration/orch-handoff-required.md
    applies_when:
      - a task, phase, or plan execution completes or is blocked
      - an executor result is created after orchestration or execution work
    enforcement: must
    load: conditional
    requires: []
  - id: orch-knowledge-gateway
    path: orchestration/orch-knowledge-gateway.md
    applies_when:
      - a specification, implementation plan, or reader-facing orchestration document needs durable project knowledge for scope or drafting
      - implementation or final workflow review needs durable project knowledge outside an accepted worker packet
      - a factual executor result authored outside execution completion needs durable project knowledge
      - the operation is outside verified task execution and execution-completion reporting; accepted workers consume carried obligations
    enforcement: must
    load: conditional
    requires: []
  - id: orch-open-questions
    path: orchestration/orch-open-questions.md
    applies_when:
      - a specification is created or repaired
      - an implementation plan is created from a specification
    enforcement: must
    load: conditional
    requires: []
  - id: orch-orchestration-boundary
    path: orchestration/orch-orchestration-boundary.md
    applies_when:
      - any orchestration artifact is created, updated, validated, or reviewed
      - an orch-* skill writes or validates content under .work-bundle/orchestration/
    enforcement: must
    load: conditional
    requires: []
  - id: orch-review-completion
    path: orchestration/orch-review-completion.md
    applies_when:
      - a frozen task or integrated implementation candidate receives independent advisory product review
      - the controller assesses implementation review advice for task acceptance, repair, or dependency continuation
      - a completed or blocked implementation plan receives final workflow audit, finalization, or archive assessment
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-lifecycle-authority
    path: lifecycle-authority.md
    applies_when:
      - an orchestration task result is accepted, released as a dependency, resumed, finalized, or archived
      - accepted execution authority or its freshness binding is validated for lifecycle progression
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-repository-boundary
    path: repository-boundary.md
    applies_when:
      - an orchestration task stores execution evidence or source changes in a repository or workspace control plane
      - historical source validation is bound to repository commits or trees
    enforcement: must
    load: conditional
    requires: []
  - id: rule-work-bundle-security-exclusion
    path: security-exclusion.md
    applies_when:
      - a task, script index entry, plan, or handoff identifies a credential requirement
      - initialization, doctor, migration, discovery, indexing, or validation touches credential-store structure or redacted credential-use evidence
      - an operation could expose credential material through agent-visible or tracked surfaces
    enforcement: must
    load: conditional
    requires: []
  - id: script-stage-determinacy
    path: script-stage-determinacy.md
    applies_when:
      - an agent considers delegating a new workflow conclusion, gate, or lifecycle transition to a WorkBundle script or reusable workspace utility
      - an agent relies on an existing script output to advance workflow progression or issue a semantic or lifecycle conclusion
    enforcement: must
    load: conditional
    requires: []
  - id: verification-evidence-before-claim
    path: verification-evidence-before-claim.md
    applies_when:
      - an agent is about to state that code, a task, a workflow, a review, an archive, or a knowledge update is complete, fixed, passing, clean, validated, or resolved
    enforcement: must
    load: conditional
    requires: []
  - id: wb-create-rule
    path: work-bundle/wb-create-rule.md
    applies_when:
      - user requests creation, update, migration, or validation of work-bundle runtime rules
      - agent creates or edits Markdown rule files under rules/
      - agent registers or syncs rules in rules/index.yaml
      - agent creates, validates, registers, or syncs toolkit, global user, or project rule-store scopes
    enforcement: must
    load: conditional
    requires: []
  - id: wb-credential-use
    path: work-bundle/wb-credential-use.md
    applies_when:
      - a user explicitly requests an operation that requires a named workspace credential ID
      - a script/index.yaml entry declares one or more credential IDs for a requested utility
      - an orchestration plan or task declares a credential ID, target, and requested operation
    enforcement: must
    load: conditional
    requires:
      - rule-work-bundle-security-exclusion
  - id: wb-defect-evaluation
    path: work-bundle/wb-defect-evaluation.md
    applies_when:
      - a conflict, violation, error, failed validation, contradictory workflow behavior, user interruption, or user correction occurs during WorkBundle-guided work
      - visible task evidence suggests a WorkBundle skill, rule, script, specification, plan, handoff, workflow contract, or toolkit execution surface may have caused or contributed to the problem
      - an agent must decide whether an observed problem is work-bundle-scoped, project-scoped, mixed, or undetermined before creating defect evidence or reporting a blocker
    enforcement: must
    load: conditional
    requires: []
  - id: wb-defect-evidence
    path: work-bundle/wb-defect-evidence.md
    applies_when:
      - a conflict, violation, contradiction, or user correction occurs during WorkBundle-guided work
      - a WorkBundle-guided task considers recording first-observed defect evidence
    enforcement: must
    load: conditional
    requires: []
  - id: wb-migrate-to-multi-repository
    path: work-bundle/wb-migrate-to-multi-repository.md
    applies_when:
      - a user requests creation of a metadata-v4 multi-repository workspace
      - explicit historical metadata-v2 or metadata-v3 migration needs the current proposal-bound transaction
      - a repository is added to an existing metadata-v4 workspace
      - a request names the retired single-to-multi topology producer and needs routing to its current v4 owner
    enforcement: must
    load: conditional
    requires:
      - wb-project-context-preflight
      - wb-project-registry
      - rule-work-bundle-security-exclusion
  - id: wb-project-context-preflight
    path: work-bundle/wb-project-context-preflight.md
    applies_when:
      - a user request starts WorkBundle-guided work for a project repository
      - task requires source-code browsing, inspection, review, planning, repair, refactor, migration, or editing in a WorkBundle-registered project
      - task requires resolving workspace structure, member source repositories, work directories, project metadata, or repository structure before acting
      - orchestration workflow resolves project metadata before specification evidence, implementation planning, execution, review, or project scope updates
      - repository preflight evaluates metadata-v4 portable repositories together with device-local bindings
      - agent checks branch baseline, commit baseline, registry locator, or CodeGraph support for a source repository
      - agent sends instructions to another task or thread that could authorize repository or worktree mutation
      - agent imports, accepts, or merges source changes produced by another task or thread
    enforcement: must
    load: conditional
    requires: []
  - id: wb-project-registry
    path: work-bundle/wb-project-registry.md
    applies_when:
      - user asks to initialize, register, locate, doctor, or migrate a WorkBundle workspace
      - a workflow creates or updates a workspace slug or repository origin locator
      - a workflow resolves workspace, project, or knowledge locations through the global project registry
    enforcement: must
    load: conditional
    requires: []
  - id: wb-skill-registry
    path: work-bundle/wb-skill-registry.md
    applies_when:
      - a user or workflow registers an external skill in the WorkBundle skill registry
      - an agent resolves available, role, or stage skills through the external skill registry
    enforcement: must
    load: conditional
    requires: []
  - id: wb-truth-basis-evidence
    path: work-bundle/wb-truth-basis-evidence.md
    applies_when:
      - an agent begins source, repository, knowledge, or workflow investigation for WorkBundle-guided work
      - an agent plans, debugs, reviews, repairs, refactors, or implements a WorkBundle-guided change
    enforcement: must
    load: conditional
    requires: []
