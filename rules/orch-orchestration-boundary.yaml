id: rule-orch-orchestration-boundary
status: current
scope: work-bundle
applies_to: {paths: [skills/orch-*/SKILL.md, references/orch-*], skills: [orch-*], artifacts: []}
enable_when: [orchestration artifact work occurs]
severity: must
rule: Orchestration owns orchestration artifacts and may delegate durable knowledge work only to approved ks-* owners.
required_behavior: [write generated orchestration artifacts only under .work-bundle/orchestration, permit cross-skill invocation scheduling or handoff to approved ks-* owners, consume and validate delegated ks-* return evidence]
prohibited_behavior: [write orchestration artifacts under .work-bundle/knowledge, directly create edit promote delete or index durable knowledge from orch-* skills]
validation: [required fields exist, generated skills cite applicable rule, orchestration delegation remains distinct from durable knowledge write ownership]
source_authority: [orchestrator SKILL boundaries]
deprecated_sources: []
