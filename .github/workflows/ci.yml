name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Run full tests
        if: runner.os == 'Linux'
        run: uvx --python 3.13 --from pytest --with pyyaml --with sqlite-vec pytest -q

      - name: Run macOS portable tests
        if: runner.os == 'macOS'
        run: >-
          uvx --python 3.13 --from pytest --with pyyaml --with sqlite-vec
          pytest -q -k "not test_index_rebuild_installs_and_loads_sqlite_vec_when_available"

      - name: Validate skill packages
        run: bin/work-bundle-skill validate
