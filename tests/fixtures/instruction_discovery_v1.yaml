# Agent-authored cases for direct semantic assessment. IDs list the focal rule
# decisions only, not a complete loading packet. The validator checks shape;
# it must not infer applicability from prompts or claim semantic coverage.
fixtures:
  - id: knowledge-persist-approved
    relation: positive
    actor: controller
    stage: persistence
    observable_signals:
      prompt: ["Complete the reader-facing report and persist this accepted architectural decision as one current note in the owning durable leaf; the approved workflow already settles this bounded follow-up's scope, content, and intent."]
      operation: ["single-record create", "approved persistence"]
    selected_rule_ids: [ks-knowledge-boundary, ks-persistence-gate, ks-structural-value, ks-perspective-routing, ks-sensitivity-filter, ks-note-state-authority, ks-index-maintenance]
    carried_rule_ids: []
  - id: ambiguous-mixed-persistence
    relation: negative
    actor: controller
    stage: authoring
    observable_signals:
      prompt: ["Make a report and maybe update some knowledge too. Neither the durable content nor persistence scope and intent are settled; ask for the missing material decisions before writing."]
      operation: ["ambiguous mixed request", "no approved persistence follow-up"]
    selected_rule_ids: [ks-persistence-gate]
    carried_rule_ids: []
  - id: ordinary-general-knowledge
    relation: negative
    actor: controller
    stage: answer
    observable_signals:
      prompt: ["What is the capital of France? Do not inspect or persist project knowledge."]
      operation: ["general answer"]
    selected_rule_ids: []
    carried_rule_ids: []
